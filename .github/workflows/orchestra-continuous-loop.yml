name: Orchestra Continuous Loop

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: orchestra-continuous-loop
  cancel-in-progress: true

jobs:
  orchestra-continuous:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - run: npm ci
      - run: npm run build
      
      - name: Run Orchestra Continuous Mode
        env:
          VCS_PROVIDER: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENAI_API_KEY }}
          AI_BASE_URL: https://openrouter.ai/api/v1
          AI_MODEL: ${{ secrets.AI_MODEL || 'openrouter/auto' }}
        run: node dist/index.js continuous ./README.md

name: Orchestra Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  orchestra:
    runs-on: ubuntu-latest
    environment: OPENAI_API_KEY
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for git diff analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install

      - name: Run Orchestra Auto-Pilot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENAI_API_KEY }}
          AI_BASE_URL: https://openrouter.ai/api/v1
          AI_MODEL: ${{ secrets.AI_MODEL || 'openrouter/auto' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm start -- auto

      - name: Run Orchestra PR Review
        if: github.event_name == 'pull_request'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY || secrets.OPENAI_API_KEY }}
          AI_BASE_URL: https://openrouter.ai/api/v1
          AI_MODEL: ${{ secrets.AI_MODEL || 'openrouter/auto' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm start -- pr-review  ${{ github.event.pull_request.number }}

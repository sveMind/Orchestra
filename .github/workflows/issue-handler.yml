name: AutoBot Issue Handlers

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  agile-workflow:
    if: |
      (github.event.action == 'labeled' && (github.event.label.name == 'autobot' || github.event.label.name == 'autobot-task')) ||
      (github.event.action == 'opened' && (contains(github.event.issue.labels.*.name, 'autobot') || contains(github.event.issue.labels.*.name, 'autobot-task')))
    runs-on: ubuntu-latest
    environment: OPENAI_API_KEY
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run AutoBot Agile Workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          # Run the CLI command via ts-node
          # Quote the title to handle spaces safely
          npx ts-node src/index.ts agile ${{ github.event.issue.number }} "${{ github.event.issue.title }}"

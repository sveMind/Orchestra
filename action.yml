name: 'Orchestra AI DevOps'
description: 'AI-powered DevOps automation tool for GitHub Actions.'
inputs:
  command:
    description: 'Orchestra command to run (e.g., auto, pr-review, continuous)'
    required: true
    default: 'auto'
  args:
    description: 'Arguments for the command'
    required: false
    default: ''
  openai_api_key:
    description: 'OpenAI API Key'
    required: true
  github_token:
    description: 'GitHub Token'
    required: true
  vcs_provider:
    description: 'VCS Provider (github, gitlab, azure)'
    required: false
    default: 'github'

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
    - ${{ inputs.command }}
    - ${{ inputs.args }}
  env:
    OPENAI_API_KEY: ${{ inputs.openai_api_key }}
    GITHUB_TOKEN: ${{ inputs.github_token }}
    VCS_PROVIDER: ${{ inputs.vcs_provider }}
